version: 1
tools:
  - name: claims.lookup_case
    transport: mcp
    access: read
    purpose: Retrieve synthetic claim metadata and prior interactions.
    allowed_fields:
      - case_id
      - policy_tier
      - claim_status
      - uploaded_documents
      - contact_match
      - prior_notes
  - name: knowledge_base.search_policy
    transport: mcp
    access: read
    purpose: Retrieve generic internal policy excerpts for customer-facing guidance.
    output_requirements:
      - policy_id
      - title
      - excerpt
  - name: workflow.create_human_review
    transport: mcp
    access: limited_write
    purpose: Queue a human claims review without modifying compensation state.
    allowed_payload:
      - case_id
      - queue
      - reason
      - requested_documents
    denied_payload:
      - settlement_status
      - compensation_amount
      - approval_flag
