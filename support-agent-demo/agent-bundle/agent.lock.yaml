apiVersion: agenomic/v1alpha1
kind: Agenomic
metadata:
  name: support-agent-demo
  revision: "2026-04-29"
  synthetic: true
locked:
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.1
    reasoning_effort: low
  prompts:
    system: prompts/system.md
    skills:
      - prompts/skills/answer_product_question.md
      - prompts/skills/escalate_billing.md
  controls:
    behavior_contract: behavior.contract.yaml
    tool_lock: tools/mcp.lock.yaml
    memory_schema: memory/memory.schema.yaml
    policy_modules:
      - policies/escalation_policy.rego
  replay:
    manifest: evals/replay_manifest.yaml
release_notes:
  purpose: public_example_bundle
  caveats:
    - Product names, plans, account IDs, and invoices are synthetic.
    - Tool locks illustrate read-only support workflows with controlled escalation.
